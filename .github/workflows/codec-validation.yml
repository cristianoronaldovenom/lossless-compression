name: Codec validation
on:
  push:
    branches: [symbol10-one-bit-eco]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npx --yes node-gyp rebuild --directory native
      - run: node -e "if(!require('./binary-palette.cjs').nativeEnabled)process.exit(1)"
      - run: npm test
      - run: node tools/bench-performance.cjs 0.2 3
      - run: node tools/bench-portable.cjs 1 0.1 1 4
        env:
          S10_ENABLE_NATIVE_ENCODE: "1"
  hardware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y iverilog clang
      - run: clang -x cl -cl-std=CL1.2 -fsyntax-only -DCHUNK_WORDS=16384 -DDESCRIPTOR_WORDS=5 -DHEADER_WORDS=16 -DSYMBOL_COUNT=1024 -DWORDS_PER_GROUP=1020 palette.cl
      - run: clang -x cl -cl-std=CL1.2 -fsyntax-only -DCHUNK_WORDS=16384 -DDESCRIPTOR_WORDS=5 -DHEADER_WORDS=16 -DSYMBOL_COUNT=1024 -DWORDS_PER_GROUP=1020 -DS10_COALESCED_BINARY=1 palette.cl
      - run: clang -x cl -cl-std=CL1.2 -fsyntax-only -DCHUNK_WORDS=16384 -DDESCRIPTOR_WORDS=5 -DHEADER_WORDS=16 -DSYMBOL_COUNT=1024 -DWORDS_PER_GROUP=1020 -DS10_COALESCED_BINARY=2 palette.cl
      - run: iverilog -g2012 -s tb_s10_memory_line_decode -o /tmp/s10-line hardware/s10_memory_line_decode.v hardware/tb_s10_memory_line_decode.v && vvp /tmp/s10-line
      - run: iverilog -g2012 -s tb_s10_dictionary_sram -o /tmp/s10-dict hardware/s10_dictionary_sram.v hardware/tb_s10_dictionary_sram.v && vvp /tmp/s10-dict
      - run: iverilog -g2012 -s tb_s10_binary_stream -o /tmp/s10sim hardware/s10_binary_stream.v hardware/tb_s10_binary_stream.sv
      - run: vvp /tmp/s10sim
      - run: iverilog -g2012 -s tb_s10_dma_stream -o /tmp/s10dma hardware/s10_binary_stream.v hardware/s10_dma_stream.v hardware/tb_s10_dma_stream.sv
      - run: vvp /tmp/s10dma
